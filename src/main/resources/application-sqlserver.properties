spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=${JDBC_CONNECTION_STRING}
spring.datasource.username=${DB_ADMIN}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

spring.flyway.url=${JDBC_CONNECTION_STRING}
spring.flyway.user=${DB_ADMIN}
spring.flyway.password=${DB_PASSWORD}
spring.flyway.locations=classpath:db/migration/sqlserver
spring.flyway.baseline-version=0
spring.flyway.baseline-on-migrate=true
